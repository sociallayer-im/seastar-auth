service: seastar-auth
image: ghcr.io/sociallayer-im/seastar-auth

runner: nomad
egress: traefik

servers:
  web:
    hosts: [sg.sola.day]
    primary: true

registry:
  server: ghcr.io
  username: jiangplus
  password: GHCR_TOKEN

proxy:
  # Moved off auth.sola.day: the sign-in screens now live in seastar-app, which
  # serves that host (its middleware rewrites '/' to /signin) so the sign-in URLs
  # already in circulation keep working. This app stays deployed here as the
  # rollback target — id.sola.day is a CNAME to sg.sola.day, same as every other
  # subdomain, DNS-only so Traefik keeps issuing its own certificate.
  #
  # Release order matters: Traefik's behaviour is undefined while two services
  # claim the same Host rule, so deploy THIS first, then seastar-app.
  hosts: [id.sola.day]
  app_port: 3000
  ssl: true
  health_check_path: /api/health

ssh:
  user: root

builder:
  arch: amd64
  remote: ssh://ubuntu@wamo.city

env:
  NODE_ENV: production

secrets:
  load: [.env.production]
  inject:
    - NEXT_PUBLIC_API_URL
    - NEXT_PUBLIC_APP_URL
    - NEXT_PUBLIC_AUTH_FIELD
    - NEXT_PUBLIC_GOOGLE_CLIENT_ID
    - NEXT_PUBLIC_THIRD_PARTY_LOGIN
    - NEXT_TOKEN

retain_containers: 5
