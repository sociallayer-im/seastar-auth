service: seastar-auth
image: registry.juluo.xyz/seastar-auth

runner: nomad
egress: traefik
traefik_provider: nomad   # juluo Traefik uses the Nomad provider
force_pull: true          # always re-pull on deploy (robust to same-tag rebuilds)

servers:
  web:
    hosts: [juluo.xyz]
    primary: true

registry:
  server: registry.juluo.xyz
  username: username
  password: YATCH_TOKEN          # resolved from .env.cn.production

proxy:
  hosts: [auth.juluo.xyz]
  app_port: 3000
  ssl: true
  health_check_path: /api/health

ssh:
  user: root

builder:
  arch: amd64
  # Build overseas (clean upstream: npm/fonts/base images), no China crutches.
  remote: ssh://ubuntu@wamo.city
  # Push to the Singapore mirror; juluo pulls the same image from registry.juluo.xyz.
  push_registry: mirror-registry.sola.day

env:
  NODE_ENV: production

secrets:
  load: [.env.cn.production]
  inject:
    - NEXT_PUBLIC_API_URL
    - NEXT_PUBLIC_APP_URL
    - NEXT_PUBLIC_AUTH_FIELD
    - NEXT_PUBLIC_GOOGLE_CLIENT_ID
    - NEXT_PUBLIC_THIRD_PARTY_LOGIN
    - NEXT_TOKEN

# NEXT_PUBLIC_* are inlined at `next build` from .env.production in the build
# context. Swap in the CN values for the build, then restore the SG file.
# NOTE: if `build` fails, restore manually: mv .env.production.sgbak .env.production
pipelines:
  deploy:
    - hook: { run: '[ -f .env.production.sgbak ] || cp -f .env.production .env.production.sgbak; cp -f .env.cn.production .env.production', local: true }
    - build
    - push
    - hook: { run: 'mv -f .env.production.sgbak .env.production 2>/dev/null || rm -f .env.production', local: true }
    - lock: acquire
    - boot-proxy
    - boot-app: { rolling: true }
    - prune
    - lock: release

retain_containers: 5
